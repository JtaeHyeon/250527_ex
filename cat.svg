<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat body -->
  <ellipse cx="100" cy="130" rx="60" ry="40" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Cat head -->
  <circle cx="100" cy="90" r="35" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Ears -->
  <polygon points="75,65 65,40 85,50" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <polygon points="125,65 135,40 115,50" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="85" r="5" fill="white"/>
  <circle cx="115" cy="85" r="5" fill="white"/>
  <circle cx="85" cy="85" r="2" fill="black"/>
  <circle cx="115" cy="85" r="2" fill="black"/>
  
  <!-- Nose -->
  <triangle points="100,95 95,100 105,100" fill="pink"/>
  
  <!-- Mouth -->
  <path d="M 100,105 Q 105,115 100,120" stroke="black" stroke-width="1.5" fill="none"/>
  <path d="M 100,105 Q 95,115 100,120" stroke="black" stroke-width="1.5" fill="none"/>
  
  <!-- Whiskers -->
  <line x1="85" y1="100" x2="60" y2="95" stroke="black" stroke-width="1"/>
  <line x1="85" y1="105" x2="60" y2="105" stroke="black" stroke-width="1"/>
  <line x1="85" y1="110" x2="60" y2="115" stroke="black" stroke-width="1"/>
  <line x1="115" y1="100" x2="140" y2="95" stroke="black" stroke-width="1"/>
  <line x1="115" y1="105" x2="140" y2="105" stroke="black" stroke-width="1"/>
  <line x1="115" y1="110" x2="140" y2="115" stroke="black" stroke-width="1"/>
  
  <!-- Tail -->
  <path d="M 160,110 Q 180,90 190,120 Q 180,150 160,130" stroke="#654321" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>